0518-WA0000.mp4", "type": "video", "url": "https://raw.githubusercontent.com/Racingkonni/Klassentreffen/main/Videos/VID-20250518-WA0000.mp4"}, {"id": "755fc133aed6ee811d1eaab9", "title": "Video 02", "file": "VID-20250518-WA0398.mp4", "type": "video", "url": "https://raw.githubusercontent.com/Racingkonni/Klassentreffen/main/Videos/VID-20250518-WA0398.mp4"}, {"id": "9e239aca4fbd4d1e1e88a30b", "title": "Video 03", "file": "VID-20250518-WA0399.mp4", "type": "video", "url": "https://raw.githubusercontent.com/Racingkonni/Klassentreffen/main/Videos/VID-20250518-WA0399.mp4"}]}, {"id": "presse", "label": "Presse", "images": [], "article": {"title": "Der 17. Mai 2025 war in Hainichen der „Tag der Klassentreffen", "date": "01.06.2025", "dateLabel": "Kalendar", "paragraphs": ["Gleich drei Klassentreffen fanden am dritten Samstag im Mai in Hainichen statt. Dabei trafen sich ehemalige Schülerinnen und Schüler nach Jahrzehnten wieder. Manche waren dazu extra von weit hergereist.", "Im Goldenen Löwen fand an diesem Tag ein Treffen der Schülerinnen und Schüler des Einschulungsjahrgangs 1948 an der Grundschule Ottendorf statt. Dies war damals noch ein eigenständiger Ort und wurde erst in den 60er Jahren nach Hainichen eingemeindet.", "Organisiert hatten das Treffen Peter Mattheß aus Genf in der Schweiz und der Hainichener Egon Pedd. Die Gäste waren aus mehreren Regionen Deutschlands in den Goldenen Löwen gekommen. Ein beträchtlicher Teil der ehemaligen Schülerinnen und Schüler ist unserer Region zeitlebens treu geblieben.", "Zu den Stammgästen bei solchen Treffen zählt auch Familie Henker aus Dresden. Prof. Dr. Jobst Henker hat nach seiner Zeit in Hainichen und dem Abitur in Frankenberg Karriere als Kinderarzt im Dresdner Universitätsklinikum machte.", "Das jahrzehntelange Engagement von Peter Mattheß ist nicht genug zu würdigen. Ohne dieses wären viele Begegnungen ehemaliger Schülerinnen und Schüler in den letzten 25 Jahren nicht zustande gekommen. Egon Pedd unterstützt ihn dabei vor Ort und ist ebenfalls eine große Hilfe beim Zustandekommen der Klassentreffen. Bis vor einigen Jahren war auch noch Siegfried Götzel als Lehrer mit dabei. Leider ist er vor einiger Zeit verstorben. Familie Mattheß war bereits zum zweiten Mal in diesem Jahr in Hainichen und hatte 1000 Kilometer Fahrstrecke auf sich genommen.", "Nur wenige Meter vom Goldenen Löwen entfernt gab es im Hainichener Rathaus und später im Jugendclub Berthelsdorf an diesem Tag ebenfalls ein Klassentreffen.", "40 Jahre nach Beginn der Schulzeit an der Hainichener Eduard-Feldner-Grundschule traf sich das Einschulungsjahr 1985. Allen voran der Mitorganisator, Hainichens langjähriger stellvertretender Oberbürgermeister Jan Held. Gekommen war auch die damalige Lehrerin Sonja Groh.", "Es war natürlich ein großes Hallo, denn manche vom 1985er Jahrgang hatte es in die Ferne verschlagen, unter anderem nach Hannover, Köln, Ohrdruff und Jena in Thüringen, aber auch nach Freiberg. Einige ehemalige Schülerinnen und Schüler sind erfreulicherweise auch unserer Heimat treu geblieben. Das Ende ihrer Schulzeit Mitte der 90er Jahre fiel mit der Zeit zusammen, als in der Region Hainichen viele alteingesessene Betriebe aufgrund der mit der Wende einhergehenden neuen wirtschaftlichen Rahmenbedingungen schließen mussten. Viele waren gezwungen, ihr Glück in den alten Bundesländern zu suchen.", "Die 1985er Grundschüler statteten dem Rathausturm einen Besuch ab und schauten sich auch an alter Wirkungsstätte um, wo sich dank Hausmeister Jürgen Detsch die Türen der Eduard-Feldner-Grundschule, in der sich heute die Friedrich-Gottlob-Keller-Oberschule befindet, auch am Samstag öffneten.", "Thomas Kühn führte die ehemaligen Schülerinnen und Schüler durch die Stadt und erzählte dabei manch unterhaltesame Geschichte.", "Klassentreffen Nummer 3 fand in der Kegelbahn an der Gabelsbergerstraße statt. Dabei handelte es sich um Abschlussjahrgang 2005 am Hainichener Gellert-Gymnasium. Anlass war der 20. Jahrestag der Abiturprüfungen. Leider war der 2005er Jahrgang gleichzeitig der letzte seiner Art an der Hainichener Bildungseinrichtung, die seinerzeit aufgrund Schülermangels geschlossen werden musste. Das beigefügte Bild erhielt ich von Thomas Rothe, der diesem Jahrgang angehörte.", "Bei allen Klassentreffen waren sich gerade die ehemaligen Hainichener einig, dass unsere Stadt in den letzten Jahrzehnten eine sehr positive Entwicklung genommen hat.", "Dieter Greysinger", "Oberbürgermeister"], "sourceUrl": "https://www.hainichen.de/hainichen-aktuell/detailansicht/der-17-mai-2025-war-in-hainichen-der-tag-der-klassentreffen"}}]}];

function authError(error) {
  const messages = {
    'auth/invalid-credential': 'E-Mail-Adresse oder Passwort stimmt nicht.',
    'auth/user-not-found': 'E-Mail-Adresse oder Passwort stimmt nicht.',
    'auth/wrong-password': 'E-Mail-Adresse oder Passwort stimmt nicht.',
    'auth/invalid-email': 'Bitte gib eine gültige E-Mail-Adresse ein.',
    'auth/user-disabled': 'Dieses Benutzerkonto wurde deaktiviert.',
    'auth/too-many-requests': 'Zu viele Versuche. Bitte versuche es später erneut.',
    'auth/network-request-failed': 'Keine Verbindung zu Firebase. Bitte prüfe deine Internetverbindung.',
    'auth/operation-not-allowed': 'Die Anmeldung mit E-Mail und Passwort ist im Firebase-Projekt nicht aktiviert.'
  };
  return messages[error.code] || 'Die Anmeldung ist momentan nicht möglich. Bitte lade die Seite erneut.';
}
async function setupAuth() {
  try {
    const [{initializeApp}, {getAuth, setPersistence, browserSessionPersistence, onAuthStateChanged, signInWithEmailAndPassword, signOut}] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js')
    ]);
    const auth = getAuth(initializeApp(firebaseConfig));
    await setPersistence(auth, browserSessionPersistence);
    $('login-form').onsubmit = async event => {
      event.preventDefault();
      $('login-button').disabled = true;
      $('login-error').textContent = '';
      $('auth-status').textContent = 'Anmeldung wird geprüft …';
      try {
        await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
        $('password').value = '';
      } catch (error) {
        $('login-error').textContent = authError(error);
      } finally {
        $('login-button').disabled = false;
        $('auth-status').textContent = '';
      }
    };
    $('logout').onclick = async () => {
      $('logout').disabled = true;
      try { await signOut(auth); }
      catch (error) { $('toast').textContent = 'Abmelden fehlgeschlagen. Bitte versuche es erneut.'; $('toast').hidden = false; }
      finally { $('logout').disabled = false; }
    };
    onAuthStateChanged(auth, user => {
      $('login-view').hidden = Boolean(user);
      $('album-header').hidden = !user;
      $('album-view').hidden = !user;
      $('auth-status').textContent = '';
      $('login-button').disabled = false;
      $('toast').hidden = true;
      if (user) { openAlbum(); }
      else {
        $('gallery').replaceChildren();
        $('lightbox').close();
        $('password').value = '';
      }
    }, error => { $('login-error').textContent = authError(error); });
  } catch (error) {
    $('auth-status').textContent = '';
    $('login-error').textContent = 'Firebase konnte nicht geladen werden. Bitte prüfe deine Internetverbindung und lade die Seite erneut.';
  }
}
setupAuth();
</script>
