function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
async function openAlbum(){albums=albumData;$('album-header').hidden=false;$('album-view').hidden=false;$('total').textContent=albums.reduce((sum,a)=>sum+a.images.filter(i=>i.type!=='video').length,0)+' Bilder + '+albums.reduce((sum,a)=>sum+a.images.filter(i=>i.type==='video').length,0)+' Videos · '+albums.length+' Alben';$('tabs').replaceChildren();for(const a of albums){const b=el('button','tab',a.label);b.id='tab-'+a.id;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel');b.onclick=()=>selectAlbum(a.id);b.onkeydown=e=>{const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();const i=albums.findIndex(x=>x.id===a.id);const next=e.key==='Home'?0:e.key==='End'?albums.length-1:(i+(e.key==='ArrowRight'?1:-1)+albums.length)%albums.length;selectAlbum(albums[next].id);$('tab-'+albums[next].id).focus();};$('tabs').append(b);}selectAlbum(active);}
function selectAlbum(id,subId){const a=albums.find(a=>a.id===id);if(!a)throw Error('Unbekanntes Album.');if(subId&&!a.children?.some(c=>c.id===subId))throw Error('Unbekanntes Unteralbum.');active=id;if(subId)activeSub=subId;for(const x of albums){const b=$('tab-'+x.id);b.setAttribute('aria-selected',String(x.id===id));b.tabIndex=x.id===id?0:-1;}$('panel').setAttribute('aria-labelledby','tab-'+id);const subnav=$('subalbums');subnav.replaceChildren();subnav.hidden=!a.children;let selected=a;if(a.children){selected=a.children.find(c=>c.id===activeSub)||a.children[0];activeSub=selected.id;for(const child of a.children){const b=el('button','subalbum',child.label);b.type='button';b.setAttribute('aria-pressed',String(child.id===activeSub));b.onclick=()=>{selectAlbum(id,child.id);Array.from(subnav.children).find(x=>x.getAttribute('aria-pressed')==='true')?.focus();};subnav.append(b);}}$('album-title').textContent=a.children?a.label+' · '+selected.label:a.label;$('album-description').textContent=descriptions[id];$('count').textContent=selected.images.length+(selected.id==='videos'?' Videos':' Bilder');$('gallery').className='grid'+(id==='portraits'?'':' wide');$('gallery').querySelectorAll('video').forEach(v=>v.pause());$('gallery').replaceChildren();if(!selected.images.length)$('gallery').append(el('p','empty-album','In diesem Album sind noch keine Bilder.'));for(const image of selected.images)$('gallery').append(image.type==='video'?videoCard(image):photoCard(image));return selected;}
function openPhoto(image){
  const portrait=active==='portraits';
  const current=portrait&&image.currentUrl;
  $('large-image').src=current||image.url;
  $('large-image').alt=image.title+(current?' · 2025':'');
  $('lightbox-title').textContent=portrait?'Schülerprofil':image.title;
  const pdf=$('profile-pdf');
  pdf.replaceChildren();
  pdf.hidden=!portrait;
  const hasPdf=portrait&&pdfNames.includes(image.title);
  $('lightbox').classList.toggle('with-pdf',hasPdf);

    const link=pdfLink(image.title,'PDF in neuem Tab öffnen ↗');

    frame.src=link.href+'#view=FitH';

function pdfLink(name, label){const link=el('a','pdf-link',label);link.href='FAQ/'+encodeURIComponent(name+'.pdf');link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label',name+' – PDF in neuem Tab öffnen');return link;}
function videoCard(media){

  video.setAttribute('aria-label',media.title);
  const source=el('source');source.src=media.url;source.type='video/mp4';video.append(source);
  video.append(document.createTextNode('Dein Browser kann dieses Video nicht abspielen. Bitte nutze den Link darunter.'));
  video.addEventListener('play',()=>document.querySelectorAll('#gallery video').forEach(other=>{if(other!==video)other.pause();}));
  const caption=el('div','video-caption');caption.append(el('h3','',media.title));
  const link=el('a','','Video in neuem Tab öffnen');link.href=media.url;link.target='_blank';link.rel='noopener noreferrer';
  caption.append(link);card.append(video,caption);return card;
}

function authError(error) {
  const messages = {
    'auth/invalid-credential': 'E-Mail-Adresse oder Passwort stimmt nicht.',
    'auth/user-not-found': 'E-Mail-Adresse oder Passwort stimmt nicht.',
    'auth/wrong-password': 'E-Mail-Adresse oder Passwort stimmt nicht.',
    'auth/invalid-email': 'Bitte gib eine gültige E-Mail-Adresse ein.',
    'auth/user-disabled': 'Dieses Benutzerkonto wurde deaktiviert.',
    'auth/too-many-requests': 'Zu viele Versuche. Bitte versuche es später erneut.',
    'auth/network-request-failed': 'Keine Verbindung zu Firebase. Bitte prüfe deine Internetverbindung.',
    'auth/operation-not-allowed': 'Die Anmeldung mit E-Mail und Passwort ist im Firebase-Projekt nicht aktiviert.'
  };
  return messages[error.code] || 'Die Anmeldung ist momentan nicht möglich. Bitte lade die Seite erneut.';
}
async function setupAuth() {
  try {
    const [{initializeApp}, {getAuth, setPersistence, browserSessionPersistence, onAuthStateChanged, signInWithEmailAndPassword, signOut}] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js')
    ]);
    const auth = getAuth(initializeApp(firebaseConfig));
    await setPersistence(auth, browserSessionPersistence);
    $('login-form').onsubmit = async event => {
      event.preventDefault();
      $('login-button').disabled = true;
      $('login-error').textContent = '';
      $('auth-status').textContent = 'Anmeldung wird geprüft …';
      try {
        await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
        $('password').value = '';
      } catch (error) {
        $('login-error').textContent = authError(error);
      } finally {
        $('login-button').disabled = false;
        $('auth-status').textContent = '';
      }
    };
    $('logout').onclick = async () => {
      $('logout').disabled = true;
      try { await signOut(auth); }
      catch (error) { $('toast').textContent = 'Abmelden fehlgeschlagen. Bitte versuche es erneut.'; $('toast').hidden = false; }
      finally { $('logout').disabled = false; }
    };
    onAuthStateChanged(auth, user => {
      $('login-view').hidden = Boolean(user);
      $('album-header').hidden = !user;
      $('album-view').hidden = !user;
      $('auth-status').textContent = '';
      $('login-button').disabled = false;
      $('toast').hidden = true;
      if (user) { openAlbum(); }
      else {
        $('gallery').replaceChildren();
        $('lightbox').close();
        $('password').value = '';
      }
    }, error => { $('login-error').textContent = authError(error); });
  } catch (error) {
    $('auth-status').textContent = '';
    $('login-error').textContent = 'Firebase konnte nicht geladen werden. Bitte prüfe deine Internetverbindung und lade die Seite erneut.';
  }
}
setupAuth();
