<style>

r-top:1px solid #405069;margin-top:40px;padding-top:24px;font-size:.85rem;letter-spacing:.1em}.login-box{background:white;padding:64px 45px}.login-box h2{font-size:1.65rem;margin:14px 0 10px}.hint{color:var(--muted);line-height:1.6;font-size:.9rem}.field{display:block;margin-top:22px;font-size:.9rem;font-weight:650}.field input{display:block;width:100%;padding:13px 14px;border:1px solid #c4ceda;border-radius:7px;margin-top:8px;font-weight:400}.primary{background:var(--navy);color:white;border:0;border-radius:7px;padding:12px 20px;font-weight:650}.primary:hover{background:#294567}.login-box .primary{width:100%;margin-top:25px}.error{color:#a22b25;min-height:1.3em;font-size:.9rem;margin:14px 0 0}.main{max-width:1320px;margin:auto;padding:38px 24px 70px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}.heading h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(2.3rem,5vw,3.5rem);margin:8px 0 0}.album-total{font-size:.9rem;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:28px}.tab{display:flex;align-items:center;gap:12px;background:white;border:1px solid var(--line);border-radius:8px;padding:13px 18px;font-weight:600;color:var(--ink)}.tab[aria-selected=true]{background:var(--navy);color:white;border-color:var(--navy)}.tab span{font-size:.78rem;padding:3px 7px;border-radius:5px;background:#eaf0f7;color:#344663}.tab[aria-selected=true] span{background:#354660;color:white}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin-bottom:20px}.section-head h2{font-size:1.35rem;margin-bottom:5px}.section-head p{color:var(--muted);font-size:.9rem;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{display:grid;grid-template-columns:44% minmax(0,1fr);background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:330px}.photo{margin:0;ba ground:#071020de}dialog img{display:block;max-width:88vw;max-height:78vh;object-fit:contain;margin:auto}.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:30px;margin-bottom:12px}.dialog-top h2{font-size:1rem;margin:0}.close{border:1px solid #8290a5;color:white;background:transparent;border-radius:5px;padding:8px 13px}.notice{background:#fff3df;color:#724a14;border-radius:6px;padding:15px;margin-bottom:20px;line-height:1.6}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:13px 22px;border-radius:7px;background:var(--navy);color:white;box-shadow:0 8px 24px #0003;max-width:90vw;z-index:5}@media(min-width:1100px){.grid.wide .card{grid-template-columns:53% minmax(0,1fr)}.grid.wide{grid-template-columns:1fr}.grid.wide .image-button img{max-height:480px}.grid.wide .notes{padding:30px}.grid.wide .comments{max-height:260px}}@media(max-width:900px){.grid{grid-template-columns:1fr}.login-wrap{margin:30px 24px}.intro{padding:36px 28px}.login-box{padding:36px 28px}.user{gap:8px}}@media(max-width:600px){.login-wrap{grid-template-columns:1fr;margin:20px 16px}.intro{padding:25px}.intro h1{font-size:2.4rem;margin:12px 0}.intro p,.intro .years{display:none}.login-box{padding:25px}.top{padding:18px 16px;align-items:flex-start}.brand{font-size:.9rem}.user{flex-direction:column;align-items:flex-end;font-size:.8rem}.main{padding:26px 16px 45px}.heading{align-items:flex-start}.album-total{display:none}.tabs{gap:7px}.tab{padding:10px 12px;font-size:.9rem}.section-head{display:block}.section-head p{margin-top:8px}.card{grid-template-columns:1fr}.image-button img{height:330px;max-height:none}.notes{padding:20px}.footer{flex-direction:column;gap:8px}.heading h1{font-size:2.4rem}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}

.school-hero{position:relative;height:clamp(360px,58vw,620px);background:#15253e;overflow:hidden}.school-hero>img{width:100%;height:100%;object-fit:cover;object-position:center 52%}.school-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(9,25,46,.85),transparent 85%)}.hero-copy{position:absolute;z-index:1;bottom:10%;left:max(24px,calc((100vw - 1272px)/2));color:white}.hero-copy h1{font:400 clamp(4rem,10vw,8rem)/1 Georgia,serif;margin:12px 0 20px}.hero-copy p{letter-spacing:.05em;margin:0;line-height:1.6}.upload-actions{margin-bottom:22px}.upload-link{display:inline-block;text-decoration:none;font-size:.88rem}.upload-actions .hint{overflow-wrap:anywhere;font-size:.78rem;margin:12px 0}.faq-link{font-size:.8rem}.without-comments{grid-template-columns:1fr;min-height:0}.without-comments .notes{padding:18px}.without-comments .upload-actions{margin:0}.without-comments .image-button{height:300px}.grid.wide .without-comments{grid-template-columns:55% 45%}.login-wrap{margin-top:35px}@media(max-width:600px){.grid.wide .without-comments{grid-template-columns:1fr}.hero-copy p{font-size:.85rem}.school-hero{height:380px}}
.login-wrap{display:block;width:calc(100% - 32px);max-width:420px;margin:clamp(32px,12vh,130px) auto;border-radius:14px}.login-box{padding:38px}.login-box h1{font:400 3.3rem/1.1 Georgia,serif;text-align:center;margin:0 0 30px}.login-box .error:empty{display:none}@media(max-width:600px){.login-wrap{margin:40px auto}.login-box{padding:28px}}
.login-wrap{display:grid;grid-template-columns:1.4fr 1fr;max-width:1040px;margin:clamp(24px,10vh,100px) auto;align-items:stretch}.login-school{display:block;width:100%;height:100%;min-height:480px;object-fit:cover}.login-box{display:flex;flex-direction:column;justify-content:center;background:white}.grid.wide .image-only{grid-template-columns:1fr}.image-only .image-button{height:auto;min-height:250px}.image-only .image-button img{height:auto;max-height:560px}@media(max-width:700px){.login-wrap{grid-template-columns:1fr;max-width:460px;margin:24px auto}.login-school{height:250px;min-height:0;object-position:center}.login-box{padding:28px}.login-box h1{margin-bottom:15px}}

<body>
<header class="top" id="album-header" hidden><div class="brand"><span class="mark" aria-hidden="true">K</span><div>UNSER KLASSENALBUM<small>Erinnerungen, die bleiben.</small></div></div><div class="user" id="userbar" hidden><span id="username"></span><button class="outline" id="logout">Abmelden</button></div></header>
<section class="login-wrap" id="login-view"><img class="login-school" src="https://raw.githubusercontent.com/Racingkonni/Klassentreffen/main/images/Webschule.jpg" alt="Unser Schulgebäude"><div class="login-box"><h1>Klasse 1a</h1><div class="notice" id="local-note" hidden>Starte „Website starten.cmd“. <a href="http://127.0.0.1:8873">Klasse 1a öffnen</a>.</div><form id="login-form"><label class="field" for="name">Name<input id="name" name="username" autocomplete="username" required maxlength="80"></label><label class="field" for="password">Passwort<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button class="primary" type="submit">Anmelden</button><p class="error" id="login-error" role="alert"></p></form></div></section>
<main class="main" id="album-view" hidden><div class="heading"><div><div class="eyebrow">Gemeinsam zurückblättern</div><h1>Unser Klassenalbum</h1></div><span class="album-total" id="total"></span></div><nav class="tabs" id="tabs" role="tablist" aria-label="Fotoalben"></nav><section id="panel" role="tabpanel" tabindex="0"><div class="section-head"><div><h2 id="album-title"></h2><p id="album-description"></p></div><p id="count"></p></div><nav id="subalbums" class="subalbums" aria-label="Orte beim Klassentreffen 2025" hidden></nav><div class="grid" id="gallery"></div></section><footer class="footer"><span>Klassentreffen · Unser gemeinsames Fotoalbum</span><span>Kommentare sind bei Ausflügen möglich.</span></footer></main>
<dialog id="lightbox" aria-labelledby="lightbox-title"><div class="dialog-top"><h2 id="lightbox-title"></h2><button class="close" id="close-lightbox">Schließen ×</button></div><img id="large-image" alt=""></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let user=null,albums=[],comments=[],active='portraits';let activeSub='park';const drafts=new Map();
const descriptions={portraits:'Unsere Schulklasse von 1992.',einschulung:'Der erste Schultag in Bildern.',ausfluege:'Unterwegs mit unserer Klasse.',klassenfotos:'Alle zusammen, Jahr für Jahr.','klassentreffen-2025':'Wiedersehen, erzählen und gemeinsam in Erinnerungen schwelgen.'};
async function api(path,body){let r;try{r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Album-Request':'1','X-CSRF-Token':user?.csrf||''}:{},body:body?JSON.stringify(body):undefined});}catch{throw Error('Das Album ist gerade nicht erreichbar. Bitte „Website starten.cmd“ starten.');}let data;try{data=await r.json();}catch{throw Error('Keine gültige Antwort vom Album-Server. Bitte Website starten.cmd öffnen und http://127.0.0.1:8873 verwenden.');}if(!r.ok)throw Error(data.error||'Das hat leider nicht funktioniert.');return data;}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function showLogin(){ $('album-header').hidden=true; $('login-view').hidden=false;$('album-view').hidden=true;$('userbar').hidden=true; }
async function openAlbum(){const data=await Promise.all([api('/api/albums'),api('/api/comments')]);albums=data[0];comments=data[1];$('login-view').hidden=true;$('album-header').hidden=false;$('album-view').hidden=false;$('userbar').hidden=false;$('username').textContent=user.name+' · Admin';$('total').textContent=albums.reduce((sum,a)=>sum+a.images.length,0)+' Bilder · '+albums.length+' Alben';$('tabs').replaceChildren();for(const a of albums){const b=el('button','tab',a.label);b.id='tab-'+a.id;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel');b.onclick=()=>selectAlbum(a.id);b.onkeydown=e=>{const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();const i=albums.findIndex(x=>x.id===a.id);const next=e.key==='Home'?0:e.key==='End'?albums.length-1:(i+(e.key==='ArrowRight'?1:-1)+albums.length)%albums.length;selectAlbum(albums[next].id);$('tab-'+albums[next].id).focus();};$('tabs').append(b);}selectAlbum(active);}
function selectAlbum(id,subId){const a=albums.find(a=>a.id===id);if(!a)throw Error('Unbekanntes Album.');if(subId&&!a.children?.some(c=>c.id===subId))throw Error('Unbekanntes Unteralbum.');active=id;if(subId)activeSub=subId;for(const x of albums){const b=$('tab-'+x.id);b.setAttribute('aria-selected',String(x.id===id));b.tabIndex=x.id===id?0:-1;}$('panel').setAttribute('aria-labelledby','tab-'+id);const subnav=$('subalbums');subnav.replaceChildren();subnav.hidden=!a.children;let selected=a;if(a.children){selected=a.children.find(c=>c.id===activeSub)||a.children[0];activeSub=selected.id;for(const child of a.children){const b=el('button','subalbum',child.label);b.type='button';b.setAttribute('aria-pressed',String(child.id===activeSub));b.onclick=()=>{selectAlbum(id,child.id);Array.from(subnav.children).find(x=>x.getAttribute('aria-pressed')==='true')?.focus();};subnav.append(b);}}$('album-title').textContent=a.children?a.label+' · '+selected.label:a.label;$('album-description').textContent=descriptions[id];$('count').textContent=selected.images.length+' Bilder';$('gallery').className='grid'+(id==='portraits'?'':' wide');$('gallery').replaceChildren();if(!selected.images.length)$('gallery').append(el('p','empty-album','In diesem Album sind noch keine Bilder.'));for(const image of selected.images)$('gallery').append(photoCard(image));return selected;}
function renderComments(box,image){box.replaceChildren();const items=comments.filter(c=>c.image===image.id);if(!items.length){box.append(el('p','empty','Was fällt dir zu diesem Bild ein? Teile deine Erinnerung.'));return;}for(const c of items){const row=el('div','comment');row.append(el('strong','',c.author));const t=el('time','',new Date(c.created.replace(' ','T')+'Z').toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}));row.append(t,el('p','',c.text));box.append(row);}}
async function saveComment(imageId,text){if(typeof text!=='string'||!text.trim()||text.trim().length>2000)throw Error('Bitte 1 bis 2.000 Zeichen eingeben.');if(!albums.some(a=>a.id==='ausfluege'&&a.images.some(i=>i.id===imageId)))throw Error('Kommentare sind nur bei Ausflügen möglich.');const saved=await api('/api/comments',{image:imageId,text});comments.push(saved);drafts.delete(imageId);return saved;}
function uploadActions(image){const box=el('div','upload-actions');const link=el('a','primary upload-link','Bilder / PDF hochladen ↗');link.href='https://github.com/Racingkonni/Klassentreffen/upload/main/FAQ';link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label','Bilder oder PDF zu '+image.title+' auf GitHub hochladen');const hint=el('p','hint','Bilder und PDFs im GitHub-Ordner FAQ speichern.');const folder=el('a','faq-link','Dateien im FAQ-Ordner ansehen ↗');folder.href='https://github.com/Racingkonni/Klassentreffen/tree/main/FAQ';folder.target='_blank';folder.rel='noopener noreferrer';box.append(link,hint,folder);return box;}
function photoCard(image){const card=el('article','card');const figure=el('figure','photo');const button=el('button','image-button');button.type='button';button.setAttribute('aria-label',image.title+' vergrößern');const img=el('img');img.src=image.url;img.alt=image.title;img.loading='lazy';img.decoding='async';button.append(img);button.onclick=()=>{$('large-image').src=image.url;$('large-image').alt=image.title;$('lightbox-title').textContent=image.title;$('lightbox').showModal();};const caption=el('figcaption','',image.title);caption.append(el('span','enlarge','↗'));figure.append(button);const notes=el('div','notes');if(active==='portraits')notes.append(uploadActions(image));if(active!=='ausfluege'){card.classList.add('without-comments');card.append(figure);if(active==='portraits')card.append(notes);else card.classList.add('image-only');return card;}notes.append(el('h3','','Erinnerungen'));const list=el('div','comments');renderComments(list,image);notes.append(list);const form=el('form','comment-form');const label=el('label','','Dein Kommentar');label.htmlFor='text-'+image.id;const input=el('textarea');input.id=label.htmlFor;input.maxLength=2000;input.required=true;input.placeholder='Weißt du noch …?';input.value=drafts.get(image.id)||'';input.oninput=()=>drafts.set(image.id,input.value);const row=el('div','save-row');const status=el('span','status');status.setAttribute('role','status');const save=el('button','primary','Speichern');save.type='submit';row.append(status,save);form.append(label,input,row);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;status.className='status';status.textContent='Wird gespeichert …';try{await saveComment(image.id,input.value);input.value='';renderComments(list,image);list.scrollTop=list.scrollHeight;status.textContent='Gespeichert';}catch(err){status.className='status bad';status.textContent=err.message;}finally{save.disabled=false;}};notes.append(form);card.append(figure,notes);return card;}
$('login-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;$('login-error').textContent='';try{user=await api('/api/login',{name:$('name').value,password:$('password').value});$('password').value='';await openAlbum();}catch(err){$('login-error').textContent=err.message;}finally{button.disabled=false;}};
$('logout').onclick=async()=>{try{await api('/api/logout',{});user=null;comments=[];albums=[];drafts.clear();$('gallery').replaceChildren();$('large-image').removeAttribute('src');$('lightbox').close();showLogin();}catch(err){$('toast').textContent=err.message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,6000);}};
$('close-lightbox').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close();};
if(location.protocol==='file:'){$('local-note').hidden=false;$('login-form').hidden=true;}else{(async()=>{try{const health=await api('/health');if(health.app!=='klassenalbum')throw Error('Falscher Server.');}catch{showLogin();$('local-note').hidden=false;$('login-form').hidden=true;return;}try{user=await api('/api/session');await openAlbum();}catch{showLogin();}})();}
if(document.modelContext?.registerTool){const lifecycle=new AbortController();addEventListener('pagehide',()=>lifecycle.abort(),{once:true});for(const tool of [{name:'open_photo_album',description:'Öffnet eines der Fotoalben im sichtbaren Album.',inputSchema:{type:'object',properties:{album:{type:'string',enum:['portraits','einschulung','ausfluege','klassenfotos','klassentreffen-2025']},subalbum:{type:'string',enum:['park','rathaus','schule','jcb','goldener-loewe']}},required:['album'],additionalProperties:false},annotations:{readOnlyHint:true},execute:async input=>{if(!user)throw Error('Bitte anmelden.');const selected=selectAlbum(input.album,input.subalbum);return{album:active,subalbum:selected.id,images:selected.images.map(i=>({id:i.id,title:i.title}))};}},{name:'save_photo_comment',description:'Speichert einen Kommentar zum angegebenen Bild als angemeldeter Admin.',inputSchema:{type:'object',properties:{imageId:{type:'string'},text:{type:'string',minLength:1,maxLength:2000}},required:['imageId','text'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute:async input=>{if(!user)throw Error('Bitte anmelden.');const c=await saveComment(input.imageId,input.text);selectAlbum(active);return{id:c.id,author:c.author,saved:true};}}]){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}}
</script>
</body>
</html>
